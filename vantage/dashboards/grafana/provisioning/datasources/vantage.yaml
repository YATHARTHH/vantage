apiVersion: 1

datasources:
  - name: Vantage API
    uid: vantage-json-api
    type: marcusolsson-json-datasource
    access: proxy
    isDefault: true
    jsonData:
      url: "http://host.docker.internal:8000/api/v1"
      customHeaders:
        - name: "X-API-Key"
          value: "dev-local-key"
