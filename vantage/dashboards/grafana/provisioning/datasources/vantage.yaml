apiVersion: 1

datasources:
  - name: Vantage API
    uid: vantage-infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    jsonData:
      baseURL: "http://host.docker.internal:8000/api/v1"
      auth_type: "headers"
      httpHeaderName1: "X-API-Key"
    secureJsonData:
      httpHeaderValue1: "dev-local-key"
